<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Pane 菜单</title>
  <style>
    :root{font:13px/1.4 ui-sans-serif,system-ui,"PingFang SC","Microsoft YaHei",sans-serif;color-scheme:light}
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:transparent}
    body[data-overlay-closed="true"]>#mask,body[data-overlay-closed="true"]>#panel{visibility:hidden}
    #mask{
      position:absolute;inset:0;margin:0;padding:0;border:0;cursor:default;
      background:rgb(0 0 0 / .32);
    }
    #panel{
      position:absolute;z-index:1;display:flex;flex-direction:column;
      width:min(320px, calc(100% - 24px));max-height:min(420px, calc(100% - 24px));
      overflow:hidden;border:1px solid hsl(var(--border,214 32% 91%));border-radius:12px;
      background:hsl(var(--background,0 0% 100%));
      box-shadow:0 16px 40px rgb(0 0 0 / .22);
      color:hsl(var(--foreground,222 47% 11%));
    }
    #panel[data-placement="center"]{left:50%;top:min(72px,12%);transform:translateX(-50%)}
    #panel[data-placement="anchor-end"]{right:12px;top:12px}
    #panel[data-empty="1"]{visibility:hidden}
    header{display:flex;height:42px;flex:none;align-items:center;gap:8px;padding:0 8px 0 12px;border-bottom:1px solid hsl(var(--border,214 32% 91%))}
    strong{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
    button{font:inherit;color:inherit}
    #close{display:grid;width:28px;height:28px;place-items:center;border:0;border-radius:7px;background:transparent;cursor:pointer}
    #close:hover,.item:hover:not(:disabled){background:hsl(var(--accent,210 40% 96%))}
    #items{min-height:0;flex:1;overflow:auto;padding:4px}
    .item{display:flex;width:100%;min-height:34px;align-items:center;gap:10px;border:0;border-radius:7px;background:transparent;padding:6px 9px;text-align:left;cursor:pointer}
    .item.selected{background:hsl(var(--accent,210 40% 96%))}
    .item.selected .label{font-weight:500;color:hsl(var(--foreground,222 47% 11%))}
    .item:disabled{cursor:not-allowed;opacity:.42}
    .label{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .meta{flex:none;color:hsl(var(--muted,215 16% 47%));font-size:11px}
    ::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{border:2px solid transparent;border-radius:999px;background:hsl(var(--muted,215 16% 47%)/.35);background-clip:padding-box}
  </style>
</head>
<body data-overlay-closed="true">
  <button type="button" id="mask" aria-label="关闭菜单"></button>
  <div id="panel" role="dialog" aria-modal="true" data-empty="1">
    <header>
      <strong id="title"></strong>
      <button id="close" type="button" aria-label="关闭">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </header>
    <div id="items" role="menu"></div>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    const instanceId = params.get("instanceId") || "panes-overlay-menu";
    /** 当前会话 token；warm shell 为 0，configure 后更新。 */
    let token = Number(params.get("token") || 0);
    let closed = false;

    const send = (message) => {
      const invoke = globalThis.__TAURI__?.core?.invoke ?? globalThis.__TAURI_INTERNALS__?.invoke;
      if (!invoke) return Promise.reject(new Error("Tauri runtime unavailable"));
      return invoke("pane_relay_to_host", {
        envelope: { instanceId, epoch: 0, message: { ...message, token } },
      });
    };

    const close = () => {
      if (closed || token === 0) return; // warm shell 不关进程，只由 host hide
      closed = true;
      document.body.dataset.overlayClosed = "true";
      void send({ type: "pane:overlay-close" }).catch(() => undefined);
    };

    const applyTheme = (theme) => {
      if (!theme || typeof theme !== "object") return;
      document.documentElement.style.colorScheme = theme.colorScheme || "light";
      for (const [name, value] of Object.entries({
        background: theme.background,
        foreground: theme.foreground,
        border: theme.border,
        accent: theme.accent,
        muted: theme.muted,
      })) if (typeof value === "string" && value) document.documentElement.style.setProperty(`--${name}`, value);
    };

    /** 渲染后短时忽略 blur，避免 host show→focus 抖动把菜单立刻关掉。 */
    let blurGuardUntil = 0;

    const renderMenu = (title, items, placement) => {
      closed = false;
      document.body.dataset.overlayClosed = "false";
      blurGuardUntil = Date.now() + 800;
      document.title = title || "Pane";
      document.querySelector("#title").textContent = title || "";
      document.querySelector("#panel").dataset.placement =
        placement === "anchor-end" ? "anchor-end" : "center";
      document.querySelector("#panel").dataset.empty = items && items.length ? "0" : "1";
      const list = document.querySelector("#items");
      list.replaceChildren();
      for (const item of items || []) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "item" + (item.selected === true ? " selected" : "");
        button.role = "menuitem";
        button.disabled = item.disabled === true;
        if (item.selected === true) button.setAttribute("aria-current", "true");
        const label = document.createElement("span");
        label.className = "label";
        label.textContent = String(item.label || "");
        button.append(label);
        if (item.meta) {
          const meta = document.createElement("span");
          meta.className = "meta";
          meta.textContent = String(item.meta);
          button.append(meta);
        }
        if (item.selected === true) {
          const check = document.createElement("span");
          check.className = "meta";
          check.setAttribute("aria-hidden", "true");
          check.textContent = "✓";
          button.append(check);
        }
        button.addEventListener("click", () => {
          void send({ type: "pane:overlay-select", value: String(item.id) }).catch(() => undefined);
        });
        list.append(button);
      }
    };

    // URL 首载（open 主路径：host navigate 带 title/items）
    let bootItems = [];
    let bootTheme = {};
    try { bootItems = JSON.parse(params.get("items") || "[]"); } catch {}
    try { bootTheme = JSON.parse(params.get("theme") || "{}"); } catch {}
    applyTheme(bootTheme);
    if (bootItems.length > 0 || (params.get("title") || "").length > 0) {
      renderMenu(params.get("title") || "Pane", bootItems, params.get("placement"));
    }

    document.querySelector("#close").addEventListener("click", close);
    document.querySelector("#mask").addEventListener("click", close);
    document.querySelector("#panel").addEventListener("click", (e) => e.stopPropagation());
    addEventListener("keydown", (event) => {
      if (event.key === "Escape") close();
    });

    let blurTimer = 0;
    addEventListener("focus", () => {
      if (blurTimer) { clearTimeout(blurTimer); blurTimer = 0; }
    });
    addEventListener("blur", () => {
      if (blurTimer) clearTimeout(blurTimer);
      blurTimer = setTimeout(() => {
        blurTimer = 0;
        if (Date.now() < blurGuardUntil) return;
        if (!document.hasFocus() && token !== 0) close();
      }, 320);
    });

    // 可选 configure 热路径（保留兼容；主路径是 URL navigate）
    const onGuest = (event) => {
      const env = event?.payload ?? event;
      if (!env || env.instanceId !== instanceId) return;
      const msg = env.message;
      if (!msg || msg.type !== "pane:overlay-configure") return;
      token = Number(msg.token || 0);
      applyTheme(msg.theme);
      renderMenu(msg.title || "Pane", msg.items || [], msg.placement);
      void send({ type: "pane:overlay-ready" }).catch(() => undefined);
    };
    const listen = globalThis.__TAURI__?.event?.listen
      ?? globalThis.__TAURI_INTERNALS__?.event?.listen;
    if (typeof listen === "function") {
      void listen("pane-relay-guest", onGuest).catch(() => undefined);
    }

    // warm(token=0) / 首载：上报 ready；token>0 时 host 会 show
    let attempts = 0;
    const ready = () => {
      attempts += 1;
      void send({ type: "pane:overlay-ready" }).then(() => {
        if (attempts > 1) clearInterval(timer);
      }).catch(() => undefined);
      if (attempts >= 30) clearInterval(timer);
    };
    const timer = setInterval(ready, 120);
    ready();
  </script>
</body>
</html>
