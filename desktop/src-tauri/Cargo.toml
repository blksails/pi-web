[package]
name = "pi-web-desktop"
version = "0.3.0"
description = "pi-web 桌面版 — Tauri 薄壳，复用 standalone 自包含产物"
edition = "2021"
rust-version = "1.77"

[features]
default = ["unstable"]
unstable = ["tauri/unstable"]

# 可执行名恒为 pi-web：Linux 的 AppImage 拒绝含 `@` 的派生名（旧 electron-builder
# 曾从包名 `@blksails/pi-web-desktop` 派生出非法名），显式钉死可执行名以规避。
[[bin]]
name = "pi-web"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# ★ 下限 2.11.1：GHSA-7gmj-67g7-phm9（is_local_url() 在 Windows/Android 有 origin 绕过）。
# ── macOS 签名相关约定（entitlements.plist 里不能写注释，故记在这里）────────────────
#
# 打包签名由 `tauri.conf.json` 的 `bundle.macOS.signingIdentity: "-"`（adhoc）驱动。不配它
# 的话 Tauri 完全跳过 bundle 签名，产出的 .app 缺 `_CodeSignature`，而二进制自身却带签名 ——
# `codesign --verify` 失败，用户双击得到「已损坏，无法打开」，右键也绕不过去。
#
# 而一旦开启签名，Tauri 会 `--deep` 重签 bundle 内**所有**可执行文件，包括随包的
# `Contents/MacOS/node`。Node 官方二进制自带的 entitlements 会被整体覆盖丢失，V8 的 JIT
# 内存映射随即被内核拒绝 —— node 一执行 JS 就 SIGTRAP（退出码 133）。症状很有迷惑性：
# `node --version` 照样退出 0（不触发 JIT），只有真跑脚本才崩，产品上表现为
# 「首启解包失败：解包器无任何输出」，完全不像签名问题。
#
# 故必须同时配 `bundle.macOS.entitlements: "entitlements.plist"`，把 allow-jit /
# allow-unsigned-executable-memory / disable-library-validation 三项补回（与 Node 官方
# 二进制原本携带的一致，不多给）。★ 该 plist 内**不可含 XML 注释** —— 标准 plist 允许，
# 但 AMFI 的解析器不认，会报 `AMFIUnserializeXML: syntax error`（实测踩过）。
#
# macos-private-api:pane_relay 的原生子 WebView 需要 `.transparent(true)`（透明底让菜单卡片
# 外可见底下的 content webview）。该方法在 macOS 上被 `#[cfg(feature = "macos-private-api")]`
# 门控，不开就编译不过 —— 而 CI 跑 Linux（`not(target_os = "macos")` 分支恒成立）看不见。
# 代价:用了私有 API 的应用会被 App Store 拒绝。本产品自分发 dmg（未签名，需 Gatekeeper
# 绕过），不走 App Store，故可接受。若将来要上架，须改为按平台条件编译并接受 macOS 无透明底。
tauri = { version = "2.11.1", features = ["unstable", "macos-private-api"] }
# 原生「选择文件夹」对话框（仅 Rust 侧调用，渲染层不授予 dialog:allow-open）。
tauri-plugin-dialog = "2"
# 外链交系统默认浏览器。
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 外链放行判定需要严谨的 URL 解析（含 IPv6 字面量 `[::1]` 的归一化）。tauri 已传递依赖之。
url = "2"
# 壳凭据取回 token 的强随机源（spec desktop-account-login Req 12）。
# 已在依赖树内（传递依赖），此处显式声明以免依赖他人的传递关系。
getrandom = "0.2"

[target.'cfg(unix)'.dependencies]
# 进程组信号（killpg）。tauri_plugin_shell 的 Command 不暴露进程组，
# 其 kill() 触不到 pi runner 孙进程，故进程树收尾必须走 libc。
libc = "0.2"
# 捕获 SIGTERM/SIGINT 转为优雅退出。tao 不处理这些信号：进程会被直接终止，
# 既不触发 RunEvent::ExitRequested 也不跑 Drop，导致 server 与 pi runner 成孤儿、端口不释放。
# 黑盒 e2e（macOS 无 WebDriver）只能靠信号退出，故这是必需而非锦上添花。
signal-hook = "0.3"

# 桌面凭据 keychain 存取（spec desktop-cloud-login 任务 4.1）。无 default features，
# 须按平台显式选后端；本期只验证 macOS（Security framework），Windows/Linux 后端随
# 同一 crate 声明以保证跨平台可编译，但未经真实验证（同 design.md Open Question 5）。
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", default-features = false, features = ["sync-secret-service", "crypto-rust"] }

[profile.release]
# 体积优先：本壳无热点计算，换取更小的安装包（迁移动机之一）。
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
